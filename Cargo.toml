[package]
name = "mypaas"
version = "0.1.0"
edition = "2024"
description = "Single-server PaaS on Docker and Traefik"
license = "MIT"
repository = "https://github.com/hydroid7/mypaasr"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures-util = "0.3.34"
glob-match = "0.2.1"
hex = "0.4.3"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ignore = "0.4.34"
libc = "0.2.191"
mdns-sd = { version = "0.21.7", optional = true }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "rand_core"] }
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zstd = "0.14.3"

[features]
default = ["lan"]
# LAN mode: announce `.local` service names over mDNS (see docs/design.md).
lan = ["dep:mdns-sd"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
