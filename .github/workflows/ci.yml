# Tests, lints and packages every push and pull request. Releases are built by
# release.yml from a tag.
name: ci

on:
  push:
    branches: [master, mypaas-rs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Without the default `lan` feature, the mdns-sd dependency is not built.
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --no-default-features --locked

  # End-to-end tests against the runner's Docker and a real Traefik.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docker-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: docker-${{ runner.os }}-
      - name: Pull the test images
        run: |
          version=$(sed -n 's/^pub const TRAEFIK_VERSION: &str = "\(.*\)";/\1/p' src/config.rs)
          docker pull -q busybox:1.36
          docker pull -q "traefik:v$version"
      - run: cargo test --locked --test docker -- --ignored

  # The release artifacts, built the same way as in release.yml, and the .deb
  # installed on a clean Debian.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build-static.sh
      - run: scripts/build-deb.sh
      - name: Install the package on Debian 13
        run: |
          docker run --rm -v "$PWD/target-deb:/d:ro" debian:13-slim sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends /d/mypaas_*_amd64.deb
            mypaas version
            apt-get remove -y -qq mypaas
            test ! -e /usr/bin/mypaas'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mypaas-${{ github.sha }}
          path: |
            target-musl/x86_64-unknown-linux-musl/release/mypaas
            target-deb/*.deb
          retention-days: 14
